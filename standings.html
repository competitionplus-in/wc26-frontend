<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Stage Standings | Pitch90</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-elevated: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: #2563eb;
            --accent-green: #10b981;
            --live-red: #ef4444;
            --border-glass: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 80px; -webkit-font-smoothing: antialiased; }

        /* --- TOP NAV --- */
        .top-bar { 
            background-color: var(--bg-card); padding: 16px 20px; display: flex; 
            align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); 
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .brand-title { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; color: var(--text-main); display: flex; align-items: center; }
        .brand-title span { color: var(--accent-glow); }
        .page-title { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}

        /* --- MAIN CONTENT --- */
        .content-container { max-width: 1000px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 30px; }

        /* Premium Elevated Card */
        .group-card {
            background: var(--bg-card); 
            border-radius: 16px; 
            overflow: hidden;
            border: 1px solid var(--border-glass); 
            box-shadow: 0 6px 12px -4px rgba(0,0,0,0.05);
        }

        /* Sleek Modern Header */
        .group-header {
            background: #f8fafc; 
            color: var(--text-main); 
            padding: 16px 20px;
            font-family: 'Oswald', sans-serif; 
            font-size: 1.25rem; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Blue accent bar next to the group name */
        .group-header::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background-color: var(--accent-glow);
            border-radius: 4px;
        }

        /* --- TABLE LAYOUT --- */
        .table-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        th { 
            background: #ffffff; 
            color: var(--text-muted); 
            padding: 12px 15px;
            font-family: 'Oswald', sans-serif; 
            font-size: 0.8rem; 
            font-weight: 600; 
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-glass); 
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        td { 
            padding: 14px 15px; 
            border-bottom: 1px solid rgba(0,0,0,0.04); 
            font-weight: 600; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            transition: background-color 0.2s ease; 
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }
        
        .center-col { text-align: center; }
        .col-pos { width: 40px; text-align: center; font-weight: 800; font-family: 'Oswald', sans-serif; font-size: 1rem; color: var(--text-muted); }
        
        /* Typography and Premium Flags */
        .col-team { min-width: 160px; display: flex; align-items: center; gap: 15px; }
        .col-team img { 
            width: 32px; height: 32px; 
            border-radius: 50%; object-fit: cover; 
            border: 1px solid var(--border-glass);
            box-shadow: 0 4px 6px rgba(0,0,0,0.06); 
        }
        .col-team span {
            font-family: 'Oswald', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }
        
        .col-pts { font-family: 'Oswald', sans-serif; font-weight: 800; color: var(--text-main); font-size: 1.25rem; }
        .col-gd { color: var(--text-muted); font-weight: 600; }

        /* Form Pills */
        .form-run { display: flex; gap: 4px; justify-content: center; }
        .form-pill { width: 20px; height: 20px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 0.7rem; font-weight: 800; color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .form-w { background-color: var(--accent-green); }
        .form-d { background-color: #94a3b8; }
        .form-l { background-color: var(--live-red); }

        /* 🏆 QUALIFICATION ZONES */
        .qualified-row td { background-color: #f2fdf9; } /* Very subtle mint green */
        .qualified-row:hover td { background-color: #e6fcf5; }
        .qualified-row td:first-child { 
            position: relative; 
            color: var(--accent-green); /* Makes the 1 and 2 green */
        }
        /* Thick green accent line on the exact edge of the row */
        .qualified-row td:first-child::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background-color: var(--accent-green);
        }

        .loading-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        
        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-card); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 25px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
        }
        @media (max-width: 768px) {
            .hide-mobile { display: none; }
            th, td { padding: 12px 8px; font-size: 0.85rem; }
            .col-team img { width: 24px; height: 24px; }
            .col-team span { font-size: 1rem; }
            .col-pts { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="/" class="brand-title" aria-label="Pitch90 Home">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="36" height="36" style="margin-right: 8px;">
                <g id="pitch90-logo">
                    <path d="M 239 55.24 A 130 130 0 1 1 215 37.42 L 215 24 L 239 24 Z" 
                          fill="#FFFFFF" stroke="#C4CCD3" stroke-width="4" stroke-linejoin="round" />
                    <path d="M 239 72.52 A 118 118 0 1 1 215 51.52 L 215 84 L 239 84 Z" 
                          fill="#2563eb" stroke="#C4CCD3" stroke-width="4" stroke-linejoin="round" />
                    <text x="148" y="205" font-family="Bahnschrift, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="bold" font-size="160" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">90</text>
                </g>
            </svg>
            PITCH<span>90</span>
        </a>
        <div class="page-title">Global Standings</div>
    </header>

    <main class="content-container" id="standings-container">
        <div class="loading-state">Synchronizing Global Leaderboards...</div>
    </main>

    <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item">
            <i data-lucide="calendar-days"></i>
            <span>Matches</span>
        </a>
        <a href="/standings" class="nav-item active">
            <i data-lucide="list-ordered"></i>
            <span>Standings</span>
        </a>
        <a href="/stats" class="nav-item">
            <i data-lucide="bar-chart-2"></i>
            <span>Stats</span>
        </a>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // 🧠 The Build Script will inject the data here permanently!
        const FLAG_DICTIONARY = [[INJECT_FLAG_DICTIONARY_HERE]];
        const INJECTED_STANDINGS = [[INJECT_STANDINGS_HERE]];
        
        // 🛡️ FRONTEND ALIAS DICTIONARY (Matches build.js)
        const teamAliases = { 
            "czechia": "czech republic", 
            "turkiye": "turkey",
            "bosnia and herzegovina": "bosnia",
            "dr congo": "congo dr",
            "cote d'ivoire": "ivory coast",
            "cabo verde": "Cabo Verde" // Fixes the uppercase key in API dictionary
        };
        
        const normalizeName = (name) => {
            // Lowercase, strip accents, translate aliases
            let cleanName = name.toLowerCase()
                                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                                .replace(/-/g, ' ')
                                .trim();
            return teamAliases[cleanName] || cleanName;
        };

        // Helper to map a form string (e.g., "W,D,L") into HTML pills
        function renderForm(formString) {
            if (!formString) return '<span style="color:var(--text-muted)">-</span>';
            const results = formString.split(',').slice(0, 5); // Take up to 5
            return results.map(r => {
                const char = r.trim().charAt(0).toUpperCase();
                const badgeClass = char === 'W' ? 'form-w' : (char === 'D' ? 'form-d' : 'form-l');
                return `<div class="form-pill ${badgeClass}">${char}</div>`;
            }).join('');
        }

        // ⚡ THE INSTANT SSG RENDER ENGINE
        function renderMasterStandings() {
            const container = document.getElementById('standings-container');
            let htmlContent = '';

            INJECTED_STANDINGS.forEach(group => {
                let rowsHTML = '';
                
                // Sort teams by Points, then Goal Difference, then Goals For
                group.teams.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);

                group.teams.forEach((team, index) => {
                    const isQualified = index < 2; // Top 2 advance
                    const rowClass = isQualified ? 'qualified-row' : '';
                    const displayGD = team.gd > 0 ? `+${team.gd}` : team.gd;

                    // 🎨 Smart Dictionary Lookup
                    const finalFlagUrl = FLAG_DICTIONARY[normalizeName(team.name)] || team.fallbackLogo;
                    const formHTML = renderForm(team.form || 'W,D,L'); 

                    rowsHTML += `
                        <tr class="${rowClass}">
                            <td class="col-pos">${index + 1}</td>
                            <td>
                                <div class="col-team">
                                    <img src="${finalFlagUrl}" alt="${team.name} Flag">
                                    <span>${team.name}</span>
                                </div>
                            </td>
                            <td class="center-col" style="color: var(--text-muted);">${team.pld}</td>
                            <td class="center-col hide-mobile">${team.w}</td>
                            <td class="center-col hide-mobile">${team.d}</td>
                            <td class="center-col hide-mobile">${team.l}</td>
                            <td class="center-col hide-mobile" style="color: var(--text-muted);">${team.gf}</td>
                            <td class="center-col hide-mobile" style="color: var(--text-muted);">${team.ga}</td>
                            <td class="center-col col-gd">${displayGD}</td>
                            <td class="center-col col-pts">${team.pts}</td>
                            <td class="center-col hide-mobile">
                                <div class="form-run">${formHTML}</div>
                            </td>
                        </tr>
                    `;
                });

                htmlContent += `
                    <div class="group-card">
                        <div class="group-header">${group.name}</div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th class="center-col">#</th>
                                        <th>Team</th>
                                        <th class="center-col">PL</th>
                                        <th class="center-col hide-mobile">W</th>
                                        <th class="center-col hide-mobile">D</th>
                                        <th class="center-col hide-mobile">L</th>
                                        <th class="center-col hide-mobile">GF</th>
                                        <th class="center-col hide-mobile">GA</th>
                                        <th class="center-col">GD</th>
                                        <th class="center-col">PTS</th>
                                        <th class="center-col hide-mobile">Form</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        renderMasterStandings();
    </script>
</body>
</html>
