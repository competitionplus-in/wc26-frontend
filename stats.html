<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Player Stats & Rankings | Pitch90</title>
    
    <meta name="description" content="View the top goal scorers, most assists, clean sheets, and disciplinary records for the 2026 tournament. Live player statistics and leaderboard updates.">
    <meta name="keywords" content="top scorers, golden boot, football stats, player rankings, world cup 2026 stats, red cards, yellow cards">
    <meta name="robots" content="index, follow">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-elevated: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: #2563eb;
            --accent-green: #10b981;
            --live-red: #ef4444;
            --border-glass: #cbd5e1;
            --gold: #eab308;
            --yellow-card: #eab308; /* Added for disciplinary cards */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 80px; -webkit-font-smoothing: antialiased; }

        /* --- TOP NAV --- */
        .top-bar { 
            background-color: var(--bg-card); padding: 16px 20px; display: flex; 
            align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass); 
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .brand-title { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .brand-title span { color: var(--accent-glow); }
        .page-title { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}

        /* --- MAIN CONTENT --- */
        /* Changed max-width to allow the 5 cards to flow nicely */
        .content-container { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 25px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

        .stat-card {
            background: var(--bg-card); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--border-glass); box-shadow: 0 4px 10px -5px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }

        .stat-header {
            background: var(--bg-elevated); color: var(--text-main); padding: 16px 20px;
            font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border-glass);
            display: flex; align-items: center; gap: 10px;
        }
        
        .stat-header svg { width: 18px; height: 18px; color: var(--accent-glow); }
        /* Custom coloring for disciplinary headers */
        .header-yellow svg { color: var(--yellow-card); }
        .header-red svg { color: var(--live-red); }

        .stat-list { display: flex; flex-direction: column; padding: 5px 20px 15px; }
        
        .stat-row {
            display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(0,0,0,0.05); gap: 15px;
        }
        .stat-row:last-child { border-bottom: none; }

        .stat-rank { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text-muted); width: 20px; text-align: center; flex-shrink: 0;}
        .stat-row:nth-child(1) .stat-rank { color: var(--gold); font-size: 1.3rem; }

        .stat-player-info { display: flex; flex-direction: column; flex: 1; overflow: hidden;}
        .stat-player-name { font-weight: 700; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .stat-team-info { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .stat-team-info img { width: 16px; height: 16px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(0,0,0,0.1); }
        .stat-team-name { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        .stat-value { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 800; color: var(--accent-glow); flex-shrink: 0;}

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-card); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 25px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600; transition: color 0.2s; }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
        }
    </style>
</head>
<body>



    

    <header class="top-bar">
    <a href="/" class="brand-title" aria-label="Pitch90 Home" style="text-decoration: none; display: flex; align-items: center;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="48" height="48" style="margin-right: 8px;">
            <g id="pitch90-logo">
                <path d="M 239 55.24 A 130 130 0 1 1 215 37.42 L 215 24 L 239 24 Z" 
                      fill="#FFFFFF" stroke="#C4CCD3" stroke-width="4" stroke-linejoin="round" />
                <path d="M 239 72.52 A 118 118 0 1 1 215 51.52 L 215 84 L 239 84 Z" 
                      fill="#2563eb" stroke="#C4CCD3" stroke-width="4" stroke-linejoin="round" />
                <text x="148" y="205" 
                      font-family="Bahnschrift" 
                      font-weight="bold" font-size="160" fill="#FFFFFF" 
                      text-anchor="middle" letter-spacing="-2">90</text>
            </g>
        </svg>
        PITCH<span>90</span>
    </a>
    <div class="page-title">Global Stats</div> </header>




    

    <main class="content-container" id="stats-main-container">
        </main>

    <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item">
            <i data-lucide="calendar-days"></i>
            <span>Matches</span>
        </a>
        <a href="/standings" class="nav-item">
            <i data-lucide="list-ordered"></i>
            <span>Standings</span>
        </a>
        <a href="/stats" class="nav-item active">
            <i data-lucide="bar-chart-2"></i>
            <span>Stats</span>
        </a>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // 🧠 The Build Script will inject the data here permanently!
        const FLAG_DICTIONARY = [[INJECT_FLAG_DICTIONARY_HERE]];
        const INJECTED_STATS = [[INJECT_STATS_HERE]];
        
        const normalizeName = (name) => name.toLowerCase().replace(/-/g, ' ').trim();

        // ⚡ THE INSTANT SSG RENDER ENGINE
        function renderTournamentStats() {
            const container = document.getElementById('stats-main-container');

            // Helper function to generate rows
            const generateRows = (players) => {
                if(!players || players.length === 0) return `<div style="padding: 20px 0; text-align: center; color: var(--text-muted); font-size: 0.85rem;">No data available yet.</div>`;
                
                return players.map((p, index) => {
                    const finalFlagUrl = FLAG_DICTIONARY[normalizeName(p.teamName)] || p.fallbackLogo;

                    return `
                        <div class="stat-row">
                            <div class="stat-rank">${index + 1}</div>
                            <div class="stat-player-info">
                                <div class="stat-player-name">${p.name}</div>
                                <div class="stat-team-info">
                                    <img src="${finalFlagUrl}" alt="${p.teamName}" loading="lazy">
                                    <span class="stat-team-name">${p.teamName}</span>
                                </div>
                            </div>
                            <div class="stat-value">${p.value}</div>
                        </div>
                    `;
                }).join('');
            };

            // Build the UI
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-header"><i data-lucide="crosshair"></i> Top Scorers</div>
                    <div class="stat-list">
                        ${generateRows(INJECTED_STATS.topScorers)}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header"><i data-lucide="footprints"></i> Most Assists</div>
                    <div class="stat-list">
                        ${generateRows(INJECTED_STATS.topAssists)}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header"><i data-lucide="shield-check"></i> Clean Sheets</div>
                    <div class="stat-list">
                        ${generateRows(INJECTED_STATS.cleanSheets)}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header header-yellow"><i data-lucide="square"></i> Yellow Cards</div>
                    <div class="stat-list">
                        ${generateRows(INJECTED_STATS.yellowCards)}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header header-red"><i data-lucide="square"></i> Red Cards</div>
                    <div class="stat-list">
                        ${generateRows(INJECTED_STATS.redCards)}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        renderTournamentStats();
    </script>
</body>
</html>
