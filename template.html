<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>World Cup 2026 Schedule & Live Scores | Pitch90</title>
    <meta name="description" content="Get the latest FIFA World Cup 2026 schedule, live football scores, fixtures, and group standings on Pitch90. The ultimate football match center.">
    <meta name="keywords" content="world cup 2026 schedule, live football scores, match fixtures, football results, Pitch90, soccer timeline">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pitch90.vercel.app">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: #2563eb;
            --live-red: #ef4444;
            --border-glass: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 80px; /* Space for bottom nav */
            -webkit-font-smoothing: antialiased;
        }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

        /* --- TOP APP BAR & CALENDAR --- */
        .top-bar {
            background-color: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .brand-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title span { color: var(--accent-glow); }

        .date-scroller {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 12px 20px;
            gap: 15px;
            background: #f8fafc;
        }
        .date-scroller::-webkit-scrollbar { display: none; }

        .date-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            padding: 8px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .date-pill .day { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;}
        .date-pill .date { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; }
        
        .date-pill:hover { background-color: rgba(0,0,0,0.05); }
        .date-pill.active {
            background-color: var(--text-main);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

       /* --- MAIN CONTENT & MATCH CARDS --- */
        .content-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .group-section { margin-bottom: 30px; }
        
        .group-header {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 0 0 12px 5px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        /* Premium Elevated Card */
        /* Premium Elevated Card using CSS Grid */
        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 15px;
            
            /* GRID FIX: Forces 3 columns with the score perfectly centered */
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center; /* Guarantees vertical centering */
            
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.05);
        }
        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px -5px rgba(0,0,0,0.1);
            border-color: #cbd5e1;
        }

        /* Team Blocks mirroring fix */
        .team-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .team-block.home {
            justify-content: flex-start;
        }
        .team-block.away {
            justify-content: flex-end; 
            text-align: right; 
            /* 🗑️ Deleted flex-direction: row-reverse because your HTML already handles it! */
        }
        
        .team-flag {
            width: 48px; height: 48px;
            border-radius: 50%; object-fit: cover;
            /* BORDER FIX: Subtle gray ring instead of invisible white */
            border: 1px solid var(--border-glass); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            flex-shrink: 0;
            background-color: var(--bg-card);
        }
        .team-name { 
            font-family: 'Oswald', sans-serif; 
            font-weight: 700; 
            font-size: 1.3rem; 
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        /* Massive Central Scoreboard */
        /* 1. Reduce the gap between FT and the score */
        .score-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 30%;
            gap: 2px; /* Reduced from 8px to pull them together */
        }
        
        /* 2. Make the pill look more like a badge */
        .score-time {
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted);
            background: #f1f5f9; 
            padding: 2px 10px; 
            border-radius: 6px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap; /* 🛠️ FIX: Stops "06:00 PM (-1)" from wrapping */
        }

        /* 3. Ensure the FT pill gets the right styling */
        .score-time.ft-pill {
            background-color: #e2e8f0; /* Distinct slate gray for finished matches */
            color: #475569;
            border-color: transparent;
        }

        /* --- BOTTOM NAVIGATION (MOBILE) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-card); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 25px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600;
        }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
            .content-container { padding: 30px; }
        }
        @media (max-width: 600px) {
            .match-card {
                padding: 16px 12px;
                gap: 8px; /* Tighter grid columns for small screens */
            }
            .team-block {
                gap: 8px; /* Pulls the flag and name closer together */
            }
            .team-name { 
                font-size: 0.95rem; /* Prevents long names from breaking the layout */
                line-height: 1.1; 
            }
            .team-flag {
                width: 36px; /* Shrinks the flag slightly so it doesn't dominate */
                height: 36px;
            }
            .score-main { 
                font-size: 1.6rem; /* Scales down the massive score */
            }
            .score-time {
                font-size: 0.65rem;
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-header">
            <div class="brand-title">
                PITCH<span>90</span>
            </div>
            <i data-lucide="search" style="color: var(--text-muted); cursor: pointer;" aria-label="Search Matches"></i>
        </div>

        <nav class="date-scroller" id="date-scroller" aria-label="Match Dates">
            <a href="/?date=2026-06-11" class="date-pill">
                <span class="day">Thu</span><span class="date">11 Jun</span>
            </a>
            <a href="/" class="date-pill active" aria-current="page">
                <span class="day">Today</span><span class="date">12 Jun</span>
            </a>
            <a href="/?date=2026-06-13" class="date-pill">
                <span class="day">Sat</span><span class="date">13 Jun</span>
            </a>
            <a href="/?date=2026-06-14" class="date-pill">
                <span class="day">Sun</span><span class="date">14 Jun</span>
            </a>
        </nav>
    </header>
    
    <main class="content-container">
        
        <h1 class="sr-only">FIFA World Cup 2026 Match Schedule and Live Scores</h1>
        
        [[INJECT_MATCHES_HERE]]

    </main>

    <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item active">
            <i data-lucide="calendar-days"></i>
            <span>Matches</span>
        </a>
        <a href="/standings" class="nav-item">
            <i data-lucide="list-ordered"></i>
            <span>Standings</span>
        </a>
        <a href="/stats" class="nav-item">
            <i data-lucide="bar-chart-2"></i>
            <span>Stats</span>
        </a>
    </nav>

   <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // 🏆 Auto-scroll the date ribbon to center the active "Today" pill on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const scroller = document.getElementById('date-scroller');
            const activePill = document.querySelector('.date-pill.active');
            
            if (scroller && activePill) {
                const scrollLeft = activePill.offsetLeft - (scroller.clientWidth / 2) + (activePill.clientWidth / 2);
                scroller.scrollTo({ left: scrollLeft, behavior: 'instant' });
            }
        });

        // ⚡ THE HYDRATION ENGINE ⚡
        async function hydrateLiveScores() {
            const matchCards = document.querySelectorAll('.match-card');
            const BACKEND_URL = 'https://wc26-backend-kd7l.onrender.com/api/live-match';

            matchCards.forEach(async (card) => {
                try {
                    const href = card.getAttribute('href'); 
                    const parts = href.split('/');
                    if(parts.length < 4) return;
                    
                    const fixtureDate = parts[2]; 
                    const slug = parts[3];
                    const matchId = `${slug}-${fixtureDate}`; 

                    const response = await fetch(`${BACKEND_URL}?id=${matchId}`);
                    if (!response.ok) return;
                    const data = await response.json();

                    const scoreMain = card.querySelector('.score-main');
                    const scoreTime = card.querySelector('.score-time');

                    if (data.setup.status === 'pre-match') {
                        const localKickoff = new Date(data.setup.countdownTarget);
                        const localYear = localKickoff.getFullYear();
                        const localMonth = String(localKickoff.getMonth() + 1).padStart(2, '0');
                        const localDay = String(localKickoff.getDate()).padStart(2, '0');
                        const localDateString = `${localYear}-${localMonth}-${localDay}`;

                        let timeString = localKickoff.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        if (localDateString > fixtureDate) timeString += ' (+1)';
                        else if (localDateString < fixtureDate) timeString += ' (-1)';

                        scoreTime.innerText = timeString;
                        scoreTime.className = 'score-time'; // Reset to standard pill
                        scoreMain.innerText = 'v'; 
                        scoreMain.style.color = 'var(--text-main)';

                    } else if (data.setup.status !== 'pre-match') {
                        scoreMain.innerText = `${data.homeScore} - ${data.awayScore}`;

                        if (data.setup.status === 'live') {
                            scoreTime.innerHTML = `🔴 ${data.clock}'`;
                            scoreTime.className = 'score-time live-pill'; // Applies red styling
                            scoreMain.style.color = 'var(--live-red)';
                        } else if (data.setup.status === 'post-match') {
                            scoreTime.innerText = 'FT';
                            scoreTime.className = 'score-time ft-pill'; // Applies gray styling
                            scoreMain.style.color = 'var(--text-main)';
                        }
                    }
                } catch (error) {
                    // Fail silently so UI doesn't break
                }
            });
        }

        

        // Run hydration immediately when the user opens the page
        hydrateLiveScores();
        
        // Quietly check for new goals every 30 seconds in the background
        setInterval(hydrateLiveScores, 30000);

    </script>
</body>
</html>
