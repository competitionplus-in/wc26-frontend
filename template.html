<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>World Cup 2026 Schedule & Live Scores | Pitch90</title>
    <meta name="description" content="Get the latest FIFA World Cup 2026 schedule, live football scores, fixtures, and group standings on Pitch90. The ultimate football match center.">
    <meta name="keywords" content="world cup 2026 schedule, live football scores, match fixtures, football results, Pitch90, soccer timeline">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pitch90.vercel.app">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: #2563eb;
            --live-red: #ef4444;
            --border-glass: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 80px; 
            -webkit-font-smoothing: antialiased;
        }

        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

        /* --- TOP APP BAR & CALENDAR --- */
        .top-bar {
            background-color: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        /* 🔍 Search Bar Styles */
        .brand-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            gap: 15px; 
        }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--bg-body);
            border-radius: 20px;
            padding: 8px 14px;
            flex: 1;
            max-width: 250px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .search-container:focus-within {
            border-color: var(--accent-glow);
        }
        .search-input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-left: 8px;
        }

        .brand-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title span { color: var(--accent-glow); }

        .date-scroller {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 12px 20px;
            gap: 15px;
            background: #f8fafc;
        }
        .date-scroller::-webkit-scrollbar { display: none; }

        .date-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            padding: 8px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .date-pill .day { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;}
        .date-pill .date { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; }
        
        .date-pill:hover { background-color: rgba(0,0,0,0.05); }
        .date-pill.active {
            background-color: var(--text-main);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 🔴 CSS Pulsing Live Dot */
        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--live-red);
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
            position: relative;
            top: -1px;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        /* --- MAIN CONTENT & MATCH CARDS --- */
        .content-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .group-section { margin-bottom: 30px; }
        
        .group-header {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 0 0 12px 5px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        /* Premium Elevated Card */
        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 32px 25px 20px 25px; 
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 20px;
            align-items: center; 
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 6px 12px -4px rgba(0, 0, 0, 0.05);
        }

/*   /* 🌐 Local Time Bar */
        .local-time-bar {
            grid-column: 1 / -1; /* Forces it to span across all 3 grid columns */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding-top: 15px;
            margin-top: -5px;
            border-top: 1px dashed rgba(0,0,0,0.08); /* Subtle separator line */
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .local-time-bar svg { width: 15px; height: 15px; color: var(--accent-glow); }
        
        .match-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px -5px rgba(0,0,0,0.1);
            border-color: #cbd5e1;
        }

        /* Team Blocks */
        .team-block {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%; 
        }
        .team-block.home {
            justify-content: flex-start;
        }
        .team-block.away {
            justify-content: flex-end; 
            text-align: right; 
        }
        
        .team-flag {
            width: 48px; height: 48px;
            border-radius: 50%; object-fit: cover;
            border: 1px solid var(--border-glass); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            flex-shrink: 0;
            background-color: var(--bg-card);
        }
        .team-name { 
            font-family: 'Oswald', sans-serif; 
            font-weight: 700; 
            font-size: 1.3rem; 
            color: var(--text-main);
            letter-spacing: 0.5px;
            white-space: normal;
            word-wrap: break-word;
        }

        /* Massive Central Scoreboard */
        .score-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%; 
            position: relative; 
        }
        
        .score-main {
            font-family: 'Oswald', sans-serif; 
            font-size: 2.2rem; 
            font-weight: 800; 
            letter-spacing: -1px;
            line-height: 1;
            white-space: nowrap; 
        }

        .score-time {
            position: absolute;
            bottom: 100%; 
            margin-bottom: 12px; 
            font-family: 'Oswald', sans-serif;
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted);
            background: #f1f5f9; 
            padding: 2px 10px; 
            border-radius: 6px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap; 
        }

        .score-time::before {
            content: '';
            position: absolute;
            bottom: -8px; 
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background-color: #cbd5e1; 
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .score-time.ft-pill {
            background-color: #e2e8f0; 
            color: #475569;
            border-color: transparent;
        }
        .score-time.ft-pill::before {
            background-color: #94a3b8; 
        }

        .score-time.live-pill {
            background-color: rgba(239, 68, 68, 0.12);
            color: var(--live-red);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .score-time.live-pill::before {
            background-color: var(--live-red); 
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); 
        }
        
        /* --- BOTTOM NAVIGATION (MOBILE) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-card); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 25px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600;
        }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
            .content-container { padding: 30px; }
        }
        @media (max-width: 600px) {
            .match-card {
                padding: 28px 12px 16px 12px;
                gap: 8px; 
            }
            .team-block {
                gap: 8px; 
            }
            .team-name { 
                font-size: 0.95rem; 
                line-height: 1.1; 
            }
            .team-flag {
                width: 36px; 
                height: 36px;
            }
            .score-main { 
                font-size: 1.6rem; 
            }
            .score-time {
                font-size: 0.65rem;
                padding: 2px 6px;
            }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-header">
            <div class="brand-title">
                PITCH<span>90</span>
            </div>
            <div class="search-container">
                <i data-lucide="search" style="color: var(--text-muted); width: 18px; height: 18px;"></i>
                <input type="text" id="match-search" class="search-input" placeholder="Search teams...">
            </div>
        </div>

        <nav class="date-scroller" id="date-scroller" aria-label="Match Dates">
            <a href="/?date=2026-06-11" class="date-pill">
                <span class="day">Thu</span><span class="date">11 Jun</span>
            </a>
            <a href="/" class="date-pill active" aria-current="page">
                <span class="day">Today</span><span class="date">12 Jun</span>
            </a>
            <a href="/?date=2026-06-13" class="date-pill">
                <span class="day">Sat</span><span class="date">13 Jun</span>
            </a>
            <a href="/?date=2026-06-14" class="date-pill">
                <span class="day">Sun</span><span class="date">14 Jun</span>
            </a>
        </nav>
    </header>
    
    <main class="content-container">
        
        <h1 class="sr-only">FIFA World Cup 2026 Match Schedule and Live Scores</h1>
        
        [[INJECT_MATCHES_HERE]]

    </main>

    <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item active">
            <i data-lucide="calendar-days"></i>
            <span>Matches</span>
        </a>
        <a href="/standings" class="nav-item">
            <i data-lucide="list-ordered"></i>
            <span>Standings</span>
        </a>
        <a href="/stats" class="nav-item">
            <i data-lucide="bar-chart-2"></i>
            <span>Stats</span>
        </a>
    </nav>

   <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();


// 🌐 LOCAL TIME CONVERTER
        function localizeMatchTimes() {
            const timeBars = document.querySelectorAll('.local-time-bar');
            
            timeBars.forEach(bar => {
                const kickoffStr = bar.getAttribute('data-kickoff');
                if (!kickoffStr) return;

                // Create a date object from the raw UTC string
                const localDateObj = new Date(kickoffStr);

                // Let the user's device dictate the format
                const dateOpts = { weekday: 'short', month: 'short', day: 'numeric' };
                const timeOpts = { hour: 'numeric', minute: '2-digit' };
                
                const localDate = localDateObj.toLocaleDateString(undefined, dateOpts);
                const localTime = localDateObj.toLocaleTimeString(undefined, timeOpts);

                // Inject the final string
                bar.querySelector('.local-date-text').innerText = `${localDate} | ${localTime}`;
            });
        }

        // Run instantly on load
        localizeMatchTimes();
        

        // 🔍 SEARCH & CALENDAR FILTERING ENGINE
        const searchInput = document.getElementById('match-search');
        const datePills = document.querySelectorAll('.date-pill');
        
        let currentDateFilter = new URLSearchParams(window.location.search).get('date') || '';

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase();
            const sections = document.querySelectorAll('.group-section');

            sections.forEach(section => {
                let hasVisibleCards = false;
                const cards = section.querySelectorAll('.match-card');

                cards.forEach(card => {
                    const cardText = card.innerText.toLowerCase();
                    const cardHref = card.getAttribute('href'); 
                    
                    const matchesSearch = cardText.includes(searchTerm);
                    const matchesDate = currentDateFilter === '' || cardHref.includes(`/${currentDateFilter}/`);

                    if (matchesSearch && matchesDate) {
                        card.style.display = 'grid'; 
                        hasVisibleCards = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                section.style.display = hasVisibleCards ? 'block' : 'none';
            });
        }

        if (searchInput) {
            searchInput.addEventListener('input', applyFilters);
        }

        datePills.forEach(pill => {
            pill.addEventListener('click', (e) => {
                e.preventDefault(); 
                
                datePills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');

                const url = new URL(pill.href, window.location.origin);
                currentDateFilter = url.searchParams.get('date') || '';

                window.history.pushState({}, '', pill.href);
                applyFilters();
            });
        });

        if (currentDateFilter) {
            datePills.forEach(p => p.classList.remove('active'));
            const activePill = Array.from(datePills).find(p => p.href.includes(currentDateFilter));
            if (activePill) activePill.classList.add('active');
        }
        
        setTimeout(applyFilters, 50);
        
        window.addEventListener('DOMContentLoaded', () => {
            const scroller = document.getElementById('date-scroller');
            const activePill = document.querySelector('.date-pill.active');
            
            if (scroller && activePill) {
                const scrollLeft = activePill.offsetLeft - (scroller.clientWidth / 2) + (activePill.clientWidth / 2);
                scroller.scrollTo({ left: scrollLeft, behavior: 'instant' });
            }
        });

        // ⚡ THE HYDRATION ENGINE ⚡
        async function hydrateLiveScores() {
            const matchCards = document.querySelectorAll('.match-card');
            const BACKEND_URL = 'https://wc26-backend-kd7l.onrender.com/api/live-match';

            matchCards.forEach(async (card) => {
                try {
                    const href = card.getAttribute('href'); 
                    const parts = href.split('/');
                    if(parts.length < 4) return;
                    
                    const fixtureDate = parts[2]; 
                    const slug = parts[3];
                    const matchId = `${slug}-${fixtureDate}`; 

                    const response = await fetch(`${BACKEND_URL}?id=${matchId}`);
                    if (!response.ok) return;
                    const data = await response.json();

                    const scoreMain = card.querySelector('.score-main');
                    const scoreTime = card.querySelector('.score-time');

                    if (data.setup.status === 'pre-match') {
                        const localKickoff = new Date(data.setup.countdownTarget);
                        const localYear = localKickoff.getFullYear();
                        const localMonth = String(localKickoff.getMonth() + 1).padStart(2, '0');
                        const localDay = String(localKickoff.getDate()).padStart(2, '0');
                        const localDateString = `${localYear}-${localMonth}-${localDay}`;

                        let timeString = localKickoff.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                        if (localDateString > fixtureDate) timeString += ' (+1)';
                        else if (localDateString < fixtureDate) timeString += ' (-1)';

                        scoreTime.innerText = timeString;
                        scoreTime.className = 'score-time'; 
                        scoreMain.innerText = 'v'; 
                        scoreMain.style.color = 'var(--text-main)';

                    } else if (data.setup.status !== 'pre-match') {
                        scoreMain.innerText = `${data.homeScore} - ${data.awayScore}`;

                        if (data.setup.status === 'live') {
                            scoreTime.innerHTML = `<span class="live-dot"></span>${data.clock}'`;
                            scoreTime.className = 'score-time live-pill'; 
                            scoreMain.style.color = 'var(--live-red)';
                        } else if (data.setup.status === 'post-match') {
                            scoreTime.innerText = 'FT';
                            scoreTime.className = 'score-time ft-pill'; 
                            scoreMain.style.color = 'var(--text-main)';
                        }
                    }
                } catch (error) {
                    // Fail silently so UI doesn't break
                }
            });
        }

        hydrateLiveScores();
        setInterval(hydrateLiveScores, 30000);

    </script>
</body>
</html>
