<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>World Cup 2026 Schedule & Live Scores | Pitch90</title>
    <meta name="description" content="Get the latest FIFA World Cup 2026 schedule, live football scores, fixtures, and group standings on Pitch90. The ultimate football match center.">
    <meta name="keywords" content="world cup 2026 schedule, live football scores, match fixtures, football results, Pitch90, soccer timeline">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://pitch90.vercel.app">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-glow: #2563eb;
            --live-red: #ef4444;
            --border-glass: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 80px; /* Space for bottom nav */
            -webkit-font-smoothing: antialiased;
        }

        /* Hides the H1 visually but leaves it perfectly readable for Googlebot */
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }

        /* --- TOP APP BAR & CALENDAR --- */
        .top-bar {
            background-color: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .brand-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-title span { color: var(--accent-glow); }

        /* SEO Friendly Horizontal Scroll (Using real anchor tags!) */
        .date-scroller {
            display: flex;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding: 12px 20px;
            gap: 15px;
            background: #f8fafc;
        }
        .date-scroller::-webkit-scrollbar { display: none; }

        .date-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 65px;
            padding: 8px 12px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }
        .date-pill .day { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 2px;}
        .date-pill .date { font-family: 'Oswald', sans-serif; font-size: 1.1rem; font-weight: 700; }
        
        .date-pill:hover { background-color: rgba(0,0,0,0.05); }
        .date-pill.active {
            background-color: var(--text-main);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* --- MAIN CONTENT & MATCH CARDS --- */
        .content-container {
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
        }

        .group-section { margin-bottom: 25px; }
        
        .group-header {
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 0 0 10px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .match-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -5px rgba(0,0,0,0.08);
        }

        .team-block {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 35%;
        }
        .team-block.away { justify-content: flex-end; text-align: right; }
        
        .team-flag {
            width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
            border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
        }
        .team-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 1.1rem; }

        .score-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 30%;
        }
        .score-time {
            font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
        }
        .score-main {
            font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 800; letter-spacing: 1px;
        }
        .live-text {
            color: var(--live-red); font-size: 0.75rem; font-weight: 700;
            animation: pulse 2s infinite; letter-spacing: 0.5px;
        }

        /* --- BOTTOM NAVIGATION (MOBILE) --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--bg-card); border-top: 1px solid var(--border-glass);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 25px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); text-decoration: none; font-size: 0.7rem; font-weight: 600;
        }
        .nav-item.active { color: var(--accent-glow); }
        .nav-item svg { width: 24px; height: 24px; }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
            .content-container { padding: 30px; }
        }
        @media (max-width: 600px) {
            .team-name { font-size: 0.95rem; }
            .score-main { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="brand-header">
            <div class="brand-title">
                PITCH<span>90</span>
            </div>
            <i data-lucide="search" style="color: var(--text-muted); cursor: pointer;" aria-label="Search Matches"></i>
        </div>

        <nav class="date-scroller" id="date-scroller" aria-label="Match Dates">
            <a href="/?date=2026-06-11" class="date-pill">
                <span class="day">Thu</span><span class="date">11 Jun</span>
            </a>
            <a href="/" class="date-pill active" aria-current="page">
                <span class="day">Today</span><span class="date">12 Jun</span>
            </a>
            <a href="/?date=2026-06-13" class="date-pill">
                <span class="day">Sat</span><span class="date">13 Jun</span>
            </a>
            <a href="/?date=2026-06-14" class="date-pill">
                <span class="day">Sun</span><span class="date">14 Jun</span>
            </a>
        </nav>
    </header>

    <main class="content-container">
        
        <h1 class="sr-only">FIFA World Cup 2026 Match Schedule and Live Scores</h1>
        
        </main>

    <nav class="bottom-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item active">
            <i data-lucide="calendar-days"></i>
            <span>Matches</span>
        </a>
        <a href="/standings" class="nav-item">
            <i data-lucide="list-ordered"></i>
            <span>Standings</span>
        </a>
        <a href="/stats" class="nav-item">
            <i data-lucide="bar-chart-2"></i>
            <span>Stats</span>
        </a>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // 🏆 Auto-scroll the date ribbon to center the active "Today" pill on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const scroller = document.getElementById('date-scroller');
            const activePill = document.querySelector('.date-pill.active');
            
            if (scroller && activePill) {
                const scrollLeft = activePill.offsetLeft - (scroller.clientWidth / 2) + (activePill.clientWidth / 2);
                scroller.scrollTo({ left: scrollLeft, behavior: 'instant' });
            }
        });
    </script>
</body>
</html>
